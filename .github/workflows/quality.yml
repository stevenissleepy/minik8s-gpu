name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets
      - name: Check Shell Scripts
        run: |
          bash -n scripts/build-controller-image.sh
          bash -n scripts/build-runner-image.sh
          bash -n scripts/kubectl-gpu-result.sh
