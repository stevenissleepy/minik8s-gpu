apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpujobs.gpu.minik8s.io
spec:
  group: gpu.minik8s.io
  names:
    plural: gpujobs
    singular: gpujob
    kind: GPUJob
    shortNames:
      - gj
    categories:
      - gpu
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: SlurmState
          type: string
          jsonPath: .status.slurmState
        - name: SlurmJobId
          type: string
          jsonPath: .status.slurmJobId
        - name: Submitted
          type: date
          jsonPath: .status.submittedTime
        - name: Query
          type: string
          jsonPath: .status.queryCommand
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hpccredentials.gpu.minik8s.io
spec:
  group: gpu.minik8s.io
  names:
    plural: hpccredentials
    singular: hpccredential
    kind: HPCCredential
    shortNames:
      - hpccred
    categories:
      - gpu
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
