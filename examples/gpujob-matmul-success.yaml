apiVersion: gpu.minik8s.io/v1alpha1
kind: GPUJob
metadata:
  name: matmul
spec:
  credentialRef:
    name: sjtu-hpc
  hpc:
    loginHost: sylogin.hpc.sjtu.edu.cn
  slurm:
    partition: debuga100
    qos: debug
    nodes: 1
    ntasksPerNode: 1
    cpusPerTask: 25
    gres: gpu:1
    time: "00:20:00"
    output: "%j.out"
    error: "%j.err"
    modules:
      - gcc
      - cuda
  source:
    files:
      - path: main.cu
        content: |
          #include <stdio.h>

          __global__ void add(const float* a, const float* b, float* c, int n) {
              int i = blockIdx.x * blockDim.x + threadIdx.x;
              if (i < n) c[i] = a[i] + b[i];
          }

          int main() {
              printf("replace this demo with the tiled matrix benchmark before final demo\n");
              return 0;
          }
      - path: build.sh
        mode: "0755"
        content: |
          #!/bin/bash
          nvcc -O3 -arch=sm_80 main.cu -o matrix_bench
  run:
    command: "./matrix_bench"
    collect:
      - "%j.out"
      - "%j.err"
