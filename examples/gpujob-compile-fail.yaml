apiVersion: gpu.minik8s.io/v1alpha1
kind: GPUJob
metadata:
  name: matmul-compile-fail
spec:
  credentialRef:
    name: sjtu-hpc
  hpc:
    loginHost: sylogin.hpc.sjtu.edu.cn
  slurm:
    partition: debuga100
    qos: debug
    nodes: 1
    ntasksPerNode: 1
    cpusPerTask: 25
    gres: gpu:1
    time: "00:05:00"
    output: "%j.out"
    error: "%j.err"
    modules:
      - gcc
      - cuda
  source:
    files:
      - path: main.cu
        content: |
          int main() { this_will_not_compile }
      - path: build.sh
        mode: "0755"
        content: |
          #!/bin/bash
          nvcc -O3 -arch=sm_80 main.cu -o bad
  run:
    command: "./bad"
    collect:
      - "%j.out"
      - "%j.err"
