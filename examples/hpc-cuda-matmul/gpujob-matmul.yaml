apiVersion: gpu.minik8s.io/v1alpha1
kind: GPUJob
metadata:
  name: cuda-matmul
spec:
  credentialRef:
    name: sjtu-hpc
  hpc:
    loginHost: sylogin1.hpc.sjtu.edu.cn
  slurm:
    partition: debuga100
    account: acct-stu
    qos: debug
    nodes: 1
    ntasksPerNode: 1
    cpusPerTask: 2
    gres: gpu:1
    time: "00:10:00"
    output: "%j.out"
    error: "%j.err"
  source:
    files:
      - path: main.cu
        content: |
          #include <cmath>
          #include <cstdio>
          #include <cstdlib>
          #include <cuda_runtime.h>

          #define CUDA_CHECK(call)                                                     \
              do {                                                                     \
                  cudaError_t err = (call);                                             \
                  if (err != cudaSuccess) {                                             \
                      std::fprintf(stderr, "CUDA error %s:%d: %s\n", __FILE__,          \
                                  __LINE__, cudaGetErrorString(err));                  \
                      std::exit(1);                                                     \
                  }                                                                    \
              } while (0)

          constexpr int TILE = 16;

          __global__ void matmul_tiled(const float *a, const float *b, float *c, int n) {
              __shared__ float tile_a[TILE][TILE];
              __shared__ float tile_b[TILE][TILE];
              int row = blockIdx.y * TILE + threadIdx.y;
              int col = blockIdx.x * TILE + threadIdx.x;
              float sum = 0.0f;
              for (int tile = 0; tile < n; tile += TILE) {
                  int a_col = tile + threadIdx.x;
                  int b_row = tile + threadIdx.y;
                  tile_a[threadIdx.y][threadIdx.x] =
                      (row < n && a_col < n) ? a[row * n + a_col] : 0.0f;
                  tile_b[threadIdx.y][threadIdx.x] =
                      (b_row < n && col < n) ? b[b_row * n + col] : 0.0f;
                  __syncthreads();
                  #pragma unroll
                  for (int k = 0; k < TILE; ++k) {
                      sum += tile_a[threadIdx.y][k] * tile_b[k][threadIdx.x];
                  }
                  __syncthreads();
              }
              if (row < n && col < n) {
                  c[row * n + col] = sum;
              }
          }

          __global__ void matrix_add(const float *c, const float *d, float *e, int total) {
              int i = blockIdx.x * blockDim.x + threadIdx.x;
              if (i < total) {
                  e[i] = c[i] + d[i];
              }
          }

          __global__ void fill_inputs(float *a, float *b, float *d, int total, int n) {
              int i = blockIdx.x * blockDim.x + threadIdx.x;
              if (i < total) {
                  int row = i / n;
                  int col = i % n;
                  a[i] = static_cast<float>((row % 13) + 1) * 0.01f;
                  b[i] = static_cast<float>((col % 17) + 1) * 0.02f;
                  d[i] = static_cast<float>((i % 19) + 1) * 0.001f;
              }
          }

          int main(int argc, char **argv) {
              int n = argc > 1 ? std::atoi(argv[1]) : 2048;
              int repeats = argc > 2 ? std::atoi(argv[2]) : 5;
              int device_count = 0;
              CUDA_CHECK(cudaGetDeviceCount(&device_count));
              if (device_count == 0) {
                  std::fprintf(stderr, "no CUDA device found\n");
                  return 3;
              }
              cudaDeviceProp prop{};
              CUDA_CHECK(cudaGetDeviceProperties(&prop, 0));
              size_t total = static_cast<size_t>(n) * static_cast<size_t>(n);
              size_t bytes = total * sizeof(float);
              float *a = nullptr, *b = nullptr, *c = nullptr, *d = nullptr, *e = nullptr;
              CUDA_CHECK(cudaMalloc(&a, bytes));
              CUDA_CHECK(cudaMalloc(&b, bytes));
              CUDA_CHECK(cudaMalloc(&c, bytes));
              CUDA_CHECK(cudaMalloc(&d, bytes));
              CUDA_CHECK(cudaMalloc(&e, bytes));
              int threads = 256;
              int blocks = static_cast<int>((total + threads - 1) / threads);
              fill_inputs<<<blocks, threads>>>(a, b, d, static_cast<int>(total), n);
              CUDA_CHECK(cudaGetLastError());
              CUDA_CHECK(cudaDeviceSynchronize());
              dim3 block(TILE, TILE);
              dim3 grid((n + TILE - 1) / TILE, (n + TILE - 1) / TILE);
              cudaEvent_t start, stop;
              CUDA_CHECK(cudaEventCreate(&start));
              CUDA_CHECK(cudaEventCreate(&stop));
              CUDA_CHECK(cudaEventRecord(start));
              for (int i = 0; i < repeats; ++i) {
                  matmul_tiled<<<grid, block>>>(a, b, c, n);
                  matrix_add<<<blocks, threads>>>(c, d, e, static_cast<int>(total));
              }
              CUDA_CHECK(cudaGetLastError());
              CUDA_CHECK(cudaEventRecord(stop));
              CUDA_CHECK(cudaEventSynchronize(stop));
              float elapsed_ms = 0.0f;
              CUDA_CHECK(cudaEventElapsedTime(&elapsed_ms, start, stop));
              double matmul_ops = 2.0 * static_cast<double>(n) * n * n;
              double add_ops = static_cast<double>(n) * n;
              double gflops = (matmul_ops + add_ops) * repeats /
                              (static_cast<double>(elapsed_ms) * 1.0e6);
              float sample[3] = {};
              CUDA_CHECK(cudaMemcpy(sample, e, sizeof(sample), cudaMemcpyDeviceToHost));
              float checksum = sample[0] + sample[1] + sample[2];
              std::printf("GPU tiled matmul OK\n");
              std::printf("device=%s\n", prop.name);
              std::printf("matrix_size=%d repeats=%d tile=%d\n", n, repeats, TILE);
              std::printf("elapsed_ms=%.3f gflops=%.2f checksum=%.6f\n",
                          elapsed_ms, gflops, checksum);
              CUDA_CHECK(cudaEventDestroy(start));
              CUDA_CHECK(cudaEventDestroy(stop));
              CUDA_CHECK(cudaFree(a));
              CUDA_CHECK(cudaFree(b));
              CUDA_CHECK(cudaFree(c));
              CUDA_CHECK(cudaFree(d));
              CUDA_CHECK(cudaFree(e));
              return 0;
          }
      - path: build.sh
        mode: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail
          source /etc/profile
          module load cuda/12.2.2
          nvcc -O3 -arch=sm_80 main.cu -o matmul_bench
  run:
    command: "./matmul_bench 2048 5"
    collect:
      - "%j.out"
      - "%j.err"
