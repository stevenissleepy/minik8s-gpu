apiVersion: gpu.minik8s.io/v1alpha1
kind: HPCCredential
metadata:
  name: sjtu-hpc
spec:
  username: your-hpc-user
  # Use either privateKey or password. Prefer privateKey when the HPC platform supports it.
  privateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    replace-with-your-private-key
    -----END OPENSSH PRIVATE KEY-----
  # password: replace-with-your-password
  knownHosts: |
    sylogin.hpc.sjtu.edu.cn ssh-ed25519 replace-with-known-host-key
