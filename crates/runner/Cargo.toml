[package]
name = "gpujob-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gpujob-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
api = { path = "../../../../lib/api" }
apimachinery = { path = "../../../../lib/apimachinery" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
client-rs = { path = "../../../../lib/client-rs" }
gpu-plugin-api = { path = "../api" }
logger = { path = "../../../../lib/logger" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
